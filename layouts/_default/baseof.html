<!doctype html>
<html lang="{{ .Site.Language.Params.htmlLang | default .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{{ if .IsHome }}{{ i18n "site_title" }}{{ else }}{{ .Title }} · {{ i18n "site_title" }}{{ end }}</title>
  {{ partial "head.html" . }}
</head>
<body class="dark">
  {{ partial "header.html" . }}
  <main class="responsive">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <dialog class="modal" id="dlModal">
    <h6 class="small">{{ i18n "download_source" }}</h6>
    <div id="dlSources" class="top-margin"></div>
    <nav class="right-align top-margin">
      <button class="transparent" data-ui="#dlModal">{{ i18n "close" }}</button>
    </nav>
  </dialog>

  <script>
    window.CDN_BASE = {{ .Site.Params.cdnBase }};
    window.DEVICES_BASE = {{ "devices/" | absLangURL }};
    window.I18N = {
      dlOriginal: {{ i18n "download_original" | jsonify }},
      dlMirror: {{ i18n "download_mirror" | jsonify }}
    };
  </script>
  <script src="{{ "js/app.js" | relURL }}"></script>
</body>
</html>

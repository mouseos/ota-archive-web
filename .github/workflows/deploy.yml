name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 */12 * * *"   # rebuild to pick up new archive data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.161.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch archive data
        run: git clone --depth 1 https://github.com/mouseos/ota-archive ota-archive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hugo (extended)
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar xz hugo
          sudo mv hugo /usr/local/bin/
          hugo version
      - name: Generate content from archive
        run: python scripts/gen_content.py ota-archive/OTA/Google
      - name: Build site
        run: hugo --minify --gc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
